# Publicação no Fly.io (ver docs/PUBLICAR-FLY.md).
app = "rcokr"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  DJANGO_SETTINGS_MODULE = "config.settings.prod"
  DJANGO_ALLOWED_HOSTS = "rcokr.fly.dev"
  DATABASE_URL = "sqlite:////data/okr.sqlite3"

[[mounts]]
  source = "dados_okr"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/saude/"
    [http_service.checks.headers]
      Host = "rcokr.fly.dev"
      X-Forwarded-Proto = "https"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
